name: QualityOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: qualityops_test
          POSTGRES_USER: qualityops_dev
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://qualityops_dev:test_password@localhost:5432/qualityops_test
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies (clean from lockfile)
        run: npm ci

      - name: Build shared contracts
        run: npm run build:contracts

      - name: Prettier format check
        run: npm run format:check

      - name: ESLint check
        run: npm run lint

      - name: TypeScript type-check
        run: npm run typecheck

      - name: Run database migrations
        run: npm run db:migrate

      - name: Check migration status
        run: npm run db:migrate:status

      - name: Automated tests
        run: npm test

      - name: Production build
        run: npm run build
